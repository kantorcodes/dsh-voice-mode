name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # tests import src/*.ts directly (Node type stripping ≥22.18); runtime engines stays >=18
      - name: Install
        run: npm install --no-audit --no-fund
      # E-1 build-tag 门只在 release.yml 跑：本仓惯例「先提交 src、再单独提交重建产物」，逐提交校验会让中间提交误红。
      # typecheck（E-3，2026-10-23）：devDependencies 钉的 @deepseek-ai/dsh-*@0.1.5-rc.1 实测已在 npm registry（npm view 可得），
      # 旧注释「registry 仅 0.0.1-rc.1」指 dist-tag latest，不代表版本不存在。故纯 `npm install` 即可跑，不再仅作本地门。
      # 注意它只覆盖 0.1.5-rc.1 类型面；0.2.0-rc.2 / 0.2.1-rc.2 类型矩阵仍是 E-3 待办（见 typecheck-dual.sh）。
      - name: Typecheck
        run: npm run typecheck
      # 先构建：lib/ 入库但 lib/.msedge-tts.meta.json 不入库，干净 checkout 未构建时 package-install 测试必红
      - name: Build
        run: npm run build
      - name: Unit tests & manifest self-check
        run: npm test
      # 锚点健康门（R12 入 CI）：dsh.client.inject 的 9 个锚点包在目标版本线
      # （0.1.1-rc.2 / 0.1.2-alpha.4）的存在性。脚本走 registry HTTP（无子进程、
      # 无宿主类型依赖、不需要 lib 产物），CI 有网即可跑——此前锚点漂移只能靠
      # 本地门禁发现，升级 dsh 前先红一步，避免「升级后客户端静默挂不上」。
      - name: Anchor health check
        run: npm run check:anchors
      # 文档 file:line 锚点守卫（Issue #15 R15）：代码批每次改动 src 都会批量作废文档锚点，
      # 该缺陷已复发两轮，故加机械守卫——新增锚点债务即红（exit 2），历史债务记在基线文件里。
      - name: Doc anchor health check
        run: npm run check:doc-anchors
      # E-2：notices 表里的内联包版本必须与 pnpm-lock.yaml 一致（follow-redirects 1.16.0 vs 1.16.1 漂移的守卫）
      - name: Third-party notices version check
        run: node scripts/check-notices-versions.mjs

  # 安装形态门禁：link/源码态测不出「别人从 npm 安装」的缺陷（0.7.17 及更早版本在 pnpm 11 / npm 全新安装、
  # dsh ≥0.1.7 已安装形态下无法使用，见 docs/adr/0011）。此 job 对打包产物做 pnpm(严格 build 脚本策略)+npm 全新安装并 import，
  # 并用 Node 18（engines 下限）与 22 各跑一遍，兑现 package.json 的 engines 声明。
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (build deps)
        run: npm install --no-audit --no-fund
      - name: Install pnpm (pnpm 11 requires Node >=22)
        if: ${{ matrix.node >= 22 }}
        run: npm install -g pnpm@11
      - name: Fresh-install the packed tarball (pnpm + npm) and import
        run: bash scripts/verify-install.sh

  # 依赖安全：msedge-tts 连同其传递依赖（axios、ws 等）被内联进发布包（ADR-0011），其漏洞即我们的漏洞；
  # 此 job 在已知高危（high 及以上）公告出现时让 CI 变红，提醒及时升级（见 pnpm-workspace.yaml 的 overrides）。
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11
      - name: Audit (high and above)
        run: pnpm audit --audit-level high
